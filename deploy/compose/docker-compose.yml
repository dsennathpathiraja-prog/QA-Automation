# Initial deployment target: single self-hosted Ubuntu host.
# Profiles: core (default services), llm (Ollama), vllm, s3 (S3-compatible object store), obs, airgapped.
# Add `-f docker-compose.gpu.yml` to give Ollama a GPU. UNTESTED on the authoring host (no Docker available):
# validate with `docker compose config` and the Phase 1 smoke test before relying on it.
name: qa-platform

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

networks:
  edge: {}                         # published to users
  app: { internal: true }          # api, keycloak, nginx upstreams
  data: { internal: true }         # postgres, openbao, object store
  llm: { internal: true }          # model servers
  automation: { internal: true }   # runners and browser MCP (later phases)
  egress: {}                       # only the egress proxy attaches here

volumes:
  pgdata: {}
  baodata: {}
  ollama: {}
  objects: {}
  squid-cache: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  keycloak_db_password: { file: ./secrets/keycloak_db_password }
  platform_db_password: { file: ./secrets/platform_db_password }
  keycloak_admin_password: { file: ./secrets/keycloak_admin_password }
  bao_api_role_id: { file: ./secrets/bao_api_role_id }
  bao_api_secret_id: { file: ./secrets/bao_api_secret_id }
  bao_worker_role_id: { file: ./secrets/bao_worker_role_id }
  bao_worker_secret_id: { file: ./secrets/bao_worker_secret_id }
  oidc_client_secret: { file: ./secrets/oidc_client_secret }
  launcher_token: { file: ./secrets/launcher_token }

services:
  nginx:
    <<: *common
    build: { context: ../.., dockerfile: deploy/images/web.Dockerfile }
    image: qa-platform/web:local
    ports: ["443:443"]
    networks: [edge, app]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api, keycloak]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

  api:
    <<: *common
    build: { context: ../.., dockerfile: deploy/images/api.Dockerfile }
    networks: [app, data, llm]
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-production}
      PLATFORM_PROFILE: ${PLATFORM_PROFILE:-standard}
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_HOST: postgres
      DATABASE_NAME: qa_platform
      DATABASE_USER: qa_platform
      DATABASE_PASSWORD_FILE: /run/secrets/platform_db_password
      BAO_ADDR: http://openbao:8200
      BAO_ROLE_ID_FILE: /run/secrets/bao_api_role_id
      BAO_SECRET_ID_FILE: /run/secrets/bao_api_secret_id
      AUTH_MODE: oidc
      PUBLIC_BASE_URL: https://${PUBLIC_HOSTNAME:-qa.example.local}
      OIDC_ISSUER: https://${PUBLIC_HOSTNAME:-qa.example.local}/auth/realms/qa-platform
      OIDC_INTERNAL_URL: http://keycloak:8080
      OIDC_CLIENT_ID: qa-platform
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OIDC_GROUP_FORMAT: name
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: postgres,openbao,keycloak,ollama,playwright-mcp,localhost
      OLLAMA_URL: http://ollama:11434
      OLLAMA_KEEP_ALIVE: 10m
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets: [bao_api_role_id, bao_api_secret_id, oidc_client_secret, platform_db_password]
    depends_on: { postgres: { condition: service_healthy }, openbao: { condition: service_started } }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *common
    build: { context: ../.., dockerfile: deploy/images/worker.Dockerfile }
    networks: [app, data, llm]
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-production}
      PLATFORM_PROFILE: ${PLATFORM_PROFILE:-standard}
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_HOST: postgres
      DATABASE_NAME: qa_platform
      DATABASE_USER: qa_platform
      DATABASE_PASSWORD_FILE: /run/secrets/platform_db_password
      BAO_ADDR: http://openbao:8200
      BAO_ROLE_ID_FILE: /run/secrets/bao_worker_role_id
      BAO_SECRET_ID_FILE: /run/secrets/bao_worker_secret_id
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: postgres,openbao,keycloak,ollama,playwright-mcp,localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets: [platform_db_password, bao_worker_role_id, bao_worker_secret_id]
    depends_on: { postgres: { condition: service_healthy }, openbao: { condition: service_started } }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  playwright-mcp:
    <<: *common
    profiles: [browser]
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    command: ["bash", "-lc", "npx --yes @playwright/mcp --port 8931 --host 0.0.0.0"]
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    expose: ["8931"]

  runner-launcher:
    <<: *common
    profiles: [runners]
    build: { context: ../.., dockerfile: deploy/images/runner-launcher.Dockerfile }
    networks: [app]
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      LAUNCHER_TOKEN_FILE: /run/secrets/launcher_token
      RUNNER_IMAGE_PREFIXES: ${RUNNER_IMAGE_PREFIXES:-}
      RUNNER_NETWORK: qa-platform_automation
      RUNNER_PROXY_URL: http://egress-proxy:3128
      RUNNER_MAX_CONCURRENT: ${RUNNER_MAX_CONCURRENT:-4}
    secrets: [launcher_token]
    # The only service that touches the container engine. Whoever controls it controls the host:
    # keep it off every user-facing network, keep the token secret, and prefer a rootless engine or a
    # socket proxy that allows only the calls in packages/infrastructure/src/runner/docker-engine.ts.
    group_add: ["${DOCKER_GID:-999}"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    read_only: true
    tmpfs: [/tmp]

  otel-collector:
    <<: *common
    profiles: [obs]
    image: otel/opentelemetry-collector:0.110.0
    command: ["--config=/etc/otel/collector.yaml"]
    networks: [app]
    volumes: ["./otel/collector.yaml:/etc/otel/collector.yaml:ro"]

  postgres:
    <<: *common
    image: postgres:16-alpine
    networks: [data]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PLATFORM_DB_PASSWORD_FILE: /run/secrets/platform_db_password
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [postgres_password, platform_db_password, keycloak_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm"]
    networks: [app, data]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_HOSTNAME: https://${PUBLIC_HOSTNAME:-qa.example.local}/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
    secrets: [keycloak_db_password, keycloak_admin_password]
    volumes:
      - ./keycloak/realm-qa-platform.json:/opt/keycloak/data/import/realm-qa-platform.json:ro
    depends_on: { postgres: { condition: service_healthy } }

  openbao:
    <<: *common
    image: openbao/openbao:2
    command: ["server", "-config=/openbao/config/config.hcl"]
    networks: [data]
    cap_add: [IPC_LOCK]
    volumes:
      - baodata:/openbao/data
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/audit:/openbao/audit

  egress-proxy:
    <<: *common
    image: ubuntu/squid:latest
    networks: [app, egress]
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowed-hosts.txt:/etc/squid/allowed-hosts.txt:ro
      - squid-cache:/var/spool/squid

  ollama:
    <<: *common
    image: ollama/ollama:latest
    profiles: [llm]
    networks: [llm]
    volumes: [ollama:/root/.ollama]

  object-store:
    <<: *common
    image: dxflrs/garage:v1.0.1
    profiles: [s3]
    networks: [data]
    volumes: [objects:/var/lib/garage]
