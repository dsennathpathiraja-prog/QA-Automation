# Deny by default. allowed-hosts.txt is generated from the Administrator-managed approved-host list
# (one `.domain` or `host` per line). An empty file means nothing external is reachable (air-gapped).
acl allowed dstdomain "/etc/squid/allowed-hosts.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443 8080 8443
acl CONNECT method CONNECT

# Address literals (dotted, decimal, hex, IPv6) are never forwarded. Without this rule, dstdomain falls back to
# a reverse DNS lookup for them, so an address whose PTR name is approved would pass.
acl address_literal url_regex -i ^[a-z]+://([0-9]{1,3}\.){3}[0-9]{1,3}([:/]|$) ^[a-z]+://(0x[0-9a-f]+|[0-9]+)([:/]|$) ^[a-z]+://\[ ^([0-9]{1,3}\.){3}[0-9]{1,3}: ^\[

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny address_literal
http_access allow allowed
http_access deny all

http_port 3128
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
forwarded_for delete
via off
