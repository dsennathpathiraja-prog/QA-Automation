# Minimal collector for the `obs` profile: receives OTLP/HTTP from the platform and prints what it gets.
# Replace the `debug` exporters with your own backend (Tempo, Jaeger, Prometheus remote write, ...) inside your network.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }
