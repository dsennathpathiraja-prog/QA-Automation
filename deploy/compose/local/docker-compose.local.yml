# LOCAL TRIAL ONLY. Plain HTTP on localhost, fixed throw-away passwords, no OpenBao, no egress proxy.
# Never use this file on a shared or production host; use ../docker-compose.yml for that.
# Start:  docker compose -f deploy/compose/local/docker-compose.local.yml up --build
# Open:   http://localhost:8088   (change the port with WEB_PORT, e.g. WEB_PORT=9000 before the command)
name: qa-platform-local

services:
  web:
    build: { context: ../../.., dockerfile: deploy/images/web.Dockerfile }
    ports: ["${WEB_PORT:-8088}:80"]
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, keycloak]

  api:
    build: { context: ../../.., dockerfile: deploy/images/api.Dockerfile }
    environment:
      PLATFORM_ENV: development
      PLATFORM_PROFILE: standard
      AUTH_MODE: oidc
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_HOST: postgres
      DATABASE_NAME: qa_platform
      DATABASE_USER: qa_platform
      DATABASE_PASSWORD: local-trial-db-password
      PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8088}
      OIDC_ISSUER: http://localhost:${WEB_PORT:-8088}/auth/realms/qa-platform
      OIDC_INTERNAL_URL: http://keycloak:8080
      OIDC_CLIENT_ID: qa-platform
      OIDC_CLIENT_SECRET: local-trial-client-secret
      OIDC_GROUP_FORMAT: name
      # Connector credentials are encrypted with a throw-away key in the database (development only; production uses OpenBao).
      SECRET_STORE: db-envelope
      SECRET_MASTER_KEY: bG9jYWwtdHJpYWwtbWFzdGVyLWtleS0zMi1ieXRlcyE=
      # To see models from an Ollama running on your own machine, uncomment:
      # OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: { context: ../../.., dockerfile: deploy/images/worker.Dockerfile }
    environment:
      PLATFORM_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_HOST: postgres
      DATABASE_NAME: qa_platform
      DATABASE_USER: qa_platform
      DATABASE_PASSWORD: local-trial-db-password
      SECRET_STORE: db-envelope
      SECRET_MASTER_KEY: bG9jYWwtdHJpYWwtbWFzdGVyLWtleS0zMi1ieXRlcyE=
      # Used when the runners profile is up. If that service is not running, the worker keeps checking the address itself.
      RUNNER_LAUNCHER_URL: http://runner-launcher:3002
      RUNNER_LAUNCHER_TOKEN: local-trial-launcher-token-32chars
    depends_on:
      api: { condition: service_healthy }

  # Managed Playwright MCP browser (required for Connectors → Playwright → Test connection).
  # Start: docker compose -f deploy/compose/local/docker-compose.local.yml --profile browser up --build -d
  # Connector URL from the worker: http://playwright-mcp:8931  (not localhost — the worker is another container).
  # Approve host playwright-mcp for plain http when the UI asks. MCP path is /mcp (added by the connector).
  # For MFA, sign in once and pass --storage-state to this service.
  playwright-mcp:
    profiles: [browser]
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    command: ["bash", "-lc", "npx --yes @playwright/mcp@latest --headless --port 8931 --host 0.0.0.0 --allowed-hosts '*'"]
    init: true
    expose: ["8931"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8931,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Builds the runner image and exits. The launcher starts a fresh container from qa-runner:local for each check.
  # Start with: docker compose -f deploy/compose/local/docker-compose.local.yml --profile browser --profile runners up --build -d
  runner-image:
    profiles: [runners]
    image: qa-runner:local
    build: { context: ../../.., dockerfile: deploy/images/runner.Dockerfile }
    entrypoint: ["node", "-e", "process.exit(0)"]
    restart: "no"

  # The only local service that sees the container socket. It is root here so Docker Desktop's socket is usable.
  runner-launcher:
    profiles: [runners]
    build: { context: ../../.., dockerfile: deploy/images/runner-launcher.Dockerfile }
    user: "0:0"
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      LAUNCHER_TOKEN: local-trial-launcher-token-32chars
      RUNNER_IMAGE_PREFIXES: qa-runner@
      RUNNER_LOCAL_IMAGE: qa-runner:local
      RUNNER_IMAGE_REPOSITORY: qa-runner
      RUNNER_NETWORK: qa-platform-local
      RUNNER_MAX_CONCURRENT: "2"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    read_only: true
    tmpfs: ["/tmp"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qa_platform
      POSTGRES_PASSWORD: local-trial-db-password
      POSTGRES_DB: qa_platform
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${WEB_PORT:-8088}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./realm-local.json:/opt/keycloak/data/import/realm-local.json:ro

networks:
  default:
    name: qa-platform-local

volumes:
  pgdata: {}
