# Optional overlay: map PayNSure shop hostname into playwright-mcp.
# Requires PLAYWRIGHT_MCP_SHOP_IP = real LAN / VPN IP (not host-gateway unless the shop
# truly listens on the Docker host with the correct VirtualHost).
#
# Windows PowerShell example:
#   $ip = (Resolve-DnsName sdk.paynsure.internal -Type A | Select-Object -First 1).IPAddress
#   $env:PLAYWRIGHT_MCP_SHOP_IP = $ip
#   docker compose -f deploy/compose/local/docker-compose.local.yml `
#     -f deploy/compose/local/docker-compose.playwright-shop.yml `
#     --profile browser up -d --force-recreate playwright-mcp
#
services:
  playwright-mcp:
    extra_hosts:
      # Mapping form only (Windows Compose rejects list/"host:ip" strings).
      sdk.paynsure.internal: ${PLAYWRIGHT_MCP_SHOP_IP:?Set PLAYWRIGHT_MCP_SHOP_IP to the shop LAN IP — see env.playwright.example}
